<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard CAC · Alpuerta Premiaciones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --oro: #F4C430;
    --oro-dark: #C49A1A;
    --negro: #1A1A1A;
    --gris: #6b6b6b;
    --gris-claro: #f4f4f5;
    --linea: #e5e5e5;
    --verde: #2e7d32;
    --rojo: #c0392b;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Outfit', sans-serif;
    background: #fafafa;
    color: var(--negro);
    font-weight: 300;
    padding: 32px 24px;
    max-width: 1200px;
    margin: 0 auto;
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    border-bottom: 2px solid var(--oro);
    padding-bottom: 18px;
    margin-bottom: 28px;
    flex-wrap: wrap;
    gap: 16px;
  }
  .header h1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 32px;
    font-weight: 600;
    letter-spacing: 0.5px;
  }
  .header .sub {
    color: var(--gris);
    font-size: 14px;
    margin-top: 2px;
  }
  select {
    font-family: 'Outfit', sans-serif;
    padding: 8px 14px;
    border: 1px solid var(--linea);
    border-radius: 8px;
    background: white;
    font-size: 14px;
    cursor: pointer;
  }
  .kpis {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
    gap: 14px;
    margin-bottom: 28px;
  }
  .kpi {
    background: white;
    border: 1px solid var(--linea);
    border-radius: 12px;
    padding: 18px 20px;
  }
  .kpi .label {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--gris);
    margin-bottom: 8px;
  }
  .kpi .value {
    font-size: 26px;
    font-weight: 500;
    font-family: 'Cormorant Garamond', serif;
  }
  .kpi.destacado { background: var(--negro); color: white; }
  .kpi.destacado .label { color: var(--oro); }
  .seccion-titulo {
    font-family: 'Cormorant Garamond', serif;
    font-size: 22px;
    font-weight: 600;
    margin: 8px 0 16px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    background: white;
    border: 1px solid var(--linea);
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 32px;
    font-size: 14px;
  }
  th {
    background: var(--gris-claro);
    text-align: right;
    padding: 13px 16px;
    font-weight: 500;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--gris);
  }
  th:first-child, td:first-child { text-align: left; }
  td {
    padding: 13px 16px;
    text-align: right;
    border-top: 1px solid var(--linea);
    font-weight: 400;
  }
  .canal-badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 500;
    background: var(--gris-claro);
  }
  .canal-badge.whatsapp_ads { background: #dcf8c6; color: #1b5e20; }
  .canal-badge.ig_ads { background: #fce4ec; color: #880e4f; }
  .canal-badge.fb_ads { background: #e3f2fd; color: #0d47a1; }
  .pos { color: var(--verde); }
  .muted { color: #bbb; }
  .loading, .error {
    text-align: center;
    padding: 60px 20px;
    color: var(--gris);
  }
  .error { color: var(--rojo); }
  .nota {
    font-size: 13px;
    color: var(--gris);
    background: #fffbe6;
    border: 1px solid #ffe9a8;
    border-radius: 8px;
    padding: 12px 16px;
    margin-bottom: 24px;
  }
  .footer {
    text-align: center;
    color: #bbb;
    font-size: 12px;
    margin-top: 20px;
  }
  @media (max-width: 600px) {
    body { padding: 20px 14px; }
    .header h1 { font-size: 24px; }
    table { font-size: 12px; }
    th, td { padding: 9px 8px; }
  }
</style>
</head>
<body>
  <div class="header">
    <div>
      <h1>Dashboard de CAC</h1>
      <div class="sub">Alpuerta Premiaciones · Costo de adquisición por canal</div>
    </div>
    <select id="periodoSelect" onchange="cargar(this.value)"></select>
  </div>

  <div id="contenido">
    <div class="loading">Cargando métricas...</div>
  </div>

  <div class="footer">Actualizado automáticamente · Datos de Meta Ads + Kommo</div>

<script>
const API = 'https://alpuerta-ia-comercial.vercel.app/api/dashboard-data';

function money(n) {
  if (n === null || n === undefined) return '<span class="muted">—</span>';
  return '$' + Number(n).toLocaleString('es-MX', {minimumFractionDigits: 0, maximumFractionDigits: 0});
}
function num(n) {
  if (n === null || n === undefined) return '<span class="muted">—</span>';
  return Number(n).toLocaleString('es-MX');
}
function pct(n) {
  if (n === null || n === undefined) return '<span class="muted">—</span>';
  return Number(n).toFixed(1) + '%';
}
function roasFmt(n) {
  if (n === null || n === undefined || n === 0) return '<span class="muted">—</span>';
  return Number(n).toFixed(1) + 'x';
}

async function cargar(periodo) {
  const cont = document.getElementById('contenido');
  cont.innerHTML = '<div class="loading">Cargando métricas...</div>';
  try {
    const url = periodo ? `${API}?periodo=${periodo}` : API;
    const r = await fetch(url);
    const d = await r.json();
    if (!d.ok) throw new Error(d.error || 'Error');

    // Selector de periodos
    const sel = document.getElementById('periodoSelect');
    if (sel.options.length === 0 && d.periodos_disponibles) {
      d.periodos_disponibles.forEach(p => {
        const o = document.createElement('option');
        o.value = p; o.textContent = p;
        if (p === d.periodo) o.selected = true;
        sel.appendChild(o);
      });
    }

    const t = d.totales;
    let html = '';

    // KPIs principales
    html += '<div class="kpis">';
    html += kpi('Inversión total', money(t.inversion), true);
    html += kpi('Leads', num(t.leads));
    html += kpi('Ventas', num(t.ventas));
    html += kpi('Costo por lead', money(t.costo_por_lead));
    html += kpi('CAC', money(t.cac), true);
    html += kpi('ROAS', roasFmt(t.roas));
    html += '</div>';

    // Nota si no hay leads aún
    if (t.leads === 0) {
      html += '<div class="nota">El sistema de atribución se activó recientemente. Los leads por canal empezarán a aparecer conforme entren nuevos prospectos desde tus anuncios. El gasto ya se está registrando en tiempo real.</div>';
    }

    // Tabla por canal
    html += '<div class="seccion-titulo">Desglose por canal</div>';
    html += '<table><thead><tr><th>Canal</th><th>Inversión</th><th>Leads</th><th>Ventas</th><th>Ingresos</th><th>Costo/Lead</th><th>CAC</th><th>ROAS</th><th>Cierre</th></tr></thead><tbody>';
    if (d.por_canal && d.por_canal.length) {
      d.por_canal.forEach(c => {
        html += '<tr>';
        html += `<td><span class="canal-badge ${c.canal}">${nombreCanal(c.canal)}</span></td>`;
        html += `<td>${money(c.inversion_mxn)}</td>`;
        html += `<td>${num(c.leads)}</td>`;
        html += `<td>${num(c.ventas)}</td>`;
        html += `<td>${money(c.ingresos_mxn)}</td>`;
        html += `<td>${money(c.costo_por_lead)}</td>`;
        html += `<td>${money(c.cac)}</td>`;
        html += `<td>${roasFmt(c.roas)}</td>`;
        html += `<td>${pct(c.tasa_cierre_pct)}</td>`;
        html += '</tr>';
      });
    } else {
      html += '<tr><td colspan="9" style="text-align:center;color:#bbb;padding:30px">Sin datos para este periodo</td></tr>';
    }
    html += '</tbody></table>';

    // Tabla de campañas
    if (d.campañas && d.campañas.length) {
      html += '<div class="seccion-titulo">Gasto por campaña</div>';
      html += '<table><thead><tr><th>Campaña</th><th>Canal</th><th>Gasto</th><th>Impresiones</th><th>Clicks</th></tr></thead><tbody>';
      d.campañas.forEach(c => {
        html += '<tr>';
        html += `<td>${c.campaña}</td>`;
        html += `<td><span class="canal-badge ${c.canal}">${nombreCanal(c.canal)}</span></td>`;
        html += `<td>${money(c.gasto_mxn)}</td>`;
        html += `<td>${num(c.impresiones)}</td>`;
        html += `<td>${num(c.clicks)}</td>`;
        html += '</tr>';
      });
      html += '</tbody></table>';
    }

    cont.innerHTML = html;
  } catch (e) {
    cont.innerHTML = `<div class="error">Error al cargar: ${e.message}</div>`;
  }
}

function kpi(label, value, destacado) {
  return `<div class="kpi ${destacado ? 'destacado' : ''}"><div class="label">${label}</div><div class="value">${value}</div></div>`;
}
function nombreCanal(c) {
  const map = { whatsapp_ads: 'WhatsApp', ig_ads: 'Instagram', fb_ads: 'Facebook', msn_ads: 'Messenger' };
  return map[c] || c || '—';
}

cargar();
</script>
</body>
</html>
